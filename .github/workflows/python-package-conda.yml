name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
env:
  # Yangilanishlar joylanadigan OCHIQ repo (Settings → Variables: RELEASES_REPO = user/repo).
  # Berilmasa — shu reponing o'zi ishlatiladi.
  UPDATE_REPO: ${{ vars.RELEASES_REPO || github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP
        run: |
          shopt -s nullglob; zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then exit 0; fi
          Z="${zips[0]}"; rm -rf /tmp/src; mkdir -p /tmp/src
          unzip -q -o "$Z" -d /tmp/src
          S=$(find /tmp/src -maxdepth 3 -name settings.gradle.kts | head -n1)
          [ -z "$S" ] && { echo "settings.gradle.kts topilmadi"; exit 1; }
          SRC=$(dirname "$S"); rm -rf "$SRC/.github"; cp -a "$SRC"/. .
          git rm -q --cached "$Z" || true; rm -f "$Z"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A; git commit -m "Unpack $Z" || true; git push
      - name: 3D emoji (Microsoft Fluent Emoji, MIT)
        continue-on-error: true
        run: |
          if [ -d app/src/main/assets/emoji3d ] && [ -n "$(ls -A app/src/main/assets/emoji3d 2>/dev/null)" ]; then exit 0; fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/microsoft/fluentui-emoji /tmp/fluent
          cd /tmp/fluent
          git sparse-checkout set --no-cone '/LICENSE' '/assets/**/metadata.json' '/assets/**/3D/*.png'
          cd "$GITHUB_WORKSPACE"
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          python3 tools/fluent_emoji.py /tmp/fluent/assets app/src/main/assets/emoji3d 96
          cp /tmp/fluent/LICENSE app/src/main/assets/emoji3d/LICENSE.txt || true
          du -sh app/src/main/assets/emoji3d
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MROS-Klaviatura-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: MROS-Klaviatura-APK, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.UPDATE_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: v1.0.${{ github.run_number }}
          name: MROS Keyboard v1.0.${{ github.run_number }}
          body_path: release-notes.md
          files: out/*.apk
