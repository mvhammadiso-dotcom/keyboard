name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP
        run: |
          shopt -s nullglob; zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then exit 0; fi
          Z="${zips[0]}"; rm -rf /tmp/src; mkdir -p /tmp/src
          unzip -q -o "$Z" -d /tmp/src
          S=$(find /tmp/src -maxdepth 3 -name settings.gradle.kts | head -n1)
          [ -z "$S" ] && { echo "settings.gradle.kts topilmadi"; exit 1; }
          SRC=$(dirname "$S"); rm -rf "$SRC/.github"; cp -a "$SRC"/. .
          git rm -q --cached "$Z" || true; rm -f "$Z"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A; git commit -m "Unpack $Z" || true; git push
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MROS-Klaviatura-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: MROS-Klaviatura-APK, path: out/*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MROS Klaviatura v1.0.${{ github.run_number }}
          files: out/*.apk
